[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collector"
version = "0.1.0"
description = "A domain-independent data collection cell"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["collector*"]
